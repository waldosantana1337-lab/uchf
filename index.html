<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>YouChef - Your Professional Culinary Mentor</title>
    <meta name="description" content="Master your kitchen with zero-waste logic and professional technique mentoring." />
    <meta name="theme-color" content="#F5F1E9" />
    
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="YouChef" />
    <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/google/material-design-icons/master/png/action/restaurant/gw_whitesvg/24dp.png" />
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/heroicons/2.1.3/24/outline/heroicons.min.css" />
    
  <script type="importmap">
{
  "imports": {
    "react": "https://aistudiocdn.com/react@^19.1.1",
    "react/": "https://aistudiocdn.com/react@^19.1.1/",
    "react-dom": "https://aistudiocdn.com/react-dom@^19.1.1",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.1.1/",

<style>
  @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;900&family=Playfair+Display:ital,wght@0,900;1,900&display=swap');

  :root {
    --primary-green: #3F6112;
    --accent-terracotta: #C2410C;
    --background-sand: #F5F1E9;
    --text-charcoal: #1A1A1A;
    --safe-area-inset-bottom: env(safe-area-inset-bottom);
  }

  /* Enhanced Chef Personal Themes */
  html.chef-theme-pierre {
    --primary-green: #1E3A8A; 
    --background-sand: #F0F4F8;
    --accent-terracotta: #E11D48;
  }
  html.chef-theme-nonna {
    --primary-green: #7C2D12; 
    --background-sand: #FFFBEB;
  }
  html.chef-theme-sarge {
    --primary-green: #1F2937;
    --background-sand: #E5E7EB;
  }

  * {
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    -webkit-tap-highlight-color: transparent;
  }

  body {
    font-family: 'Outfit', sans-serif;
    background-color: var(--background-sand);
    background-image: radial-gradient(circle at 2px 2px, rgba(0,0,0,0.02) 1px, transparent 0);
    background-size: 32px 32px;
    color: var(--text-charcoal);
    transition: background-color 0.8s cubic-bezier(0.4, 0, 0.2, 1);
  }

  h1, h2, h3, .font-display {
    font-family: 'Outfit', sans-serif;
    letter-spacing: -0.03em;
  }

  .italic-display {
    font-family: 'Playfair Display', serif;
    font-style: italic;
  }

  /* Advanced Motion System */
  .btn-active-scale {
    transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .btn-active-scale:active {
    transform: scale(0.94);
  }

  @keyframes fade-in-up {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .animate-fade-in-up { animation: fade-in-up 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; }

  /* Glassmorphism Classes */
  .glass-card {
    background: rgba(255, 255, 255, 0.7);
    backdrop-filter: blur(12px);
    border: 1px solid rgba(255, 255, 255, 0.3);
  }

  /* Custom Scrollbar */
  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.1); border-radius: 10px; }
  ::-webkit-scrollbar-thumb:hover { background: rgba(0,0,0,0.2); }

  @media print {
    .print-hidden { display: none !important; }
  }
</style>
<link rel="stylesheet" href="/index.css">
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
